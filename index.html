<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GUARDIAN</title>
<style>
   body{
  margin:0;
  background:#000;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI;
}

#app{
  max-width:420px;
  margin:auto;
  height:100vh;
  display:flex;
  flex-direction:column;
}

#top{
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0b0b0b;
  border-bottom:1px solid #222;
}

#logo{
  color:#ff3b30;
  font-weight:700;
  letter-spacing:3px;
}

#status{
  text-align:center;
  margin-top:30px;
}

#state{
  font-size:48px;
  font-weight:800;
  color:#00ff88;
}

#hero{
  color:#999;
  margin-top:8px;
}

#sos{
  margin:40px auto;
  width:280px;
  height:280px;
  border-radius:50%;
  border:none;
  background:#ff3b30;
  color:white;
  font-size:26px;
  font-weight:700;
  box-shadow:0 0 40px rgba(255,59,48,.6);
}

#confirmBox{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

#confirmBox h2{
  font-size:32px;
  margin-bottom:20px;
}

#confirmBox button{
  width:240px;
  padding:18px;
  margin:10px;
  border:none;
  border-radius:14px;
  font-size:20px;
}

#yes{background:#00c853;color:black;}
#no{background:#ff3b30;color:white;}

.panel{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  overflow:auto;
  padding:20px;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  background:#111;
  color:white;
  margin-bottom:12px;
}

.badge{
  background:#111;
  padding:14px;
  border-radius:10px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
}

</style>
</head>
<body>
<div id="app">

  <div id="top">
    <div id="logo">GUARDIAN</div>
    <div>
      <button onclick="toggleProfile()">Profile</button>
      <button onclick="toggleContacts()">Contacts</button>
    </div>
  </div>

  <div id="status">
    <div id="state">SAFE</div>
    <div id="hero">Your personal emergency shield</div>
  </div>

  <button id="sos">EMERGENCY SOS</button>

</div>

<!-- CONFIRM -->
<div id="confirmBox">
  <h2>Are you safe?</h2>
  <button id="yes">YES</button>
  <button id="no">NO</button>
</div>

<!-- PROFILE -->
<div id="profileBox" class="panel">
  <h2>Emergency Profile</h2>
  <input id="pname" placeholder="Name">
  <input id="page" placeholder="Age">
  <input id="pgender" placeholder="Gender">
  <input id="pblood" placeholder="Blood Type">
  <input id="pheight" placeholder="Height">
  <input id="pweight" placeholder="Weight">
  <button onclick="saveProfile()">Save</button>
</div>

<!-- CONTACTS -->
<div id="contactsBox" class="panel">
  <h2>Emergency Contacts</h2>
  <input id="cname" placeholder="Name">
  <input id="cphone" placeholder="Phone">
  <select id="cpriority">
    <option value="1">Priority 1</option>
    <option value="2">Priority 2</option>
    <option value="3">Priority 3</option>
    <option value="4">Priority 4</option>
  </select>
  <button id="addContact">Add</button>
  <div id="list"></div>
</div>

<script>
 //Emergency contacts 
const contactsBox = document.getElementById("contactsBox");
const list = document.getElementById("list");

document.getElementById("manage").onclick = () => {
  contactsBox.style.display = contactsBox.style.display === "none" ? "block" : "none";
  showContacts();
};

document.getElementById("addContact").onclick = () => {
  const name = document.getElementById("cname").value;
  const phone = document.getElementById("cphone").value;
  if(!name || !phone) return alert("Enter name and phone");

  let contacts = JSON.parse(localStorage.getItem("guardianContacts") || "[]");
 const priority = document.getElementById("cpriority").value;
contacts.push({name, phone, priority:Number(priority)});

  localStorage.setItem("guardianContacts", JSON.stringify(contacts));
  document.getElementById("cname").value="";
  document.getElementById("cphone").value="";
  showContacts();
};

function showContacts(){
function showContacts(){
  let contacts = JSON.parse(localStorage.getItem("guardianContacts") || "[]");
  contacts.sort((a,b)=>a.priority-b.priority);
  list.innerHTML = "";
  contacts.forEach(c=>{
    list.innerHTML += `<div class="badge p${c.priority}">
      ${c.name} - ${c.phone} (P${c.priority})
    </div>`;
  });
}

}
  
const state = document.getElementById("state");
const hero = document.getElementById("hero");
const box = document.getElementById("confirmBox");
const noBtn = document.getElementById("no");

let tapTimes = [];
let timer = null;
let count = 5;

// SOS button
document.getElementById("sos").onclick = () => showConfirm();

// ---------------- TAP vs SCROLL SAFE TRIPLE TAP ----------------
let startX = 0, startY = 0;

document.addEventListener("touchstart", (e) => {
  if (e.target.tagName === "BUTTON") return;
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
});

document.addEventListener("touchend", (e) => {
  if (e.target.tagName === "BUTTON") return;

  let endX = e.changedTouches[0].clientX;
  let endY = e.changedTouches[0].clientY;
  if (Math.abs(endX - startX) > 15 || Math.abs(endY - startY) > 15) return;

  let now = Date.now();
  tapTimes.push(now);
  tapTimes = tapTimes.filter(t => now - t < 2000);
  if (tapTimes.length >= 3) {
    showConfirm();
    tapTimes = [];
  }
});

// ---------------- CONFIRMATION ----------------
function showConfirm(){
  box.style.display = "block";
  startCountdown();
  navigator.vibrate(200);
}

function startCountdown(){
  stopCountdown();
  count = 5;
  noBtn.innerText = "NO (" + count + ")";
  timer = setInterval(() => {
    count--;
    noBtn.innerText = "NO (" + count + ")";
    if(count <= 0) triggerEmergency();
  },1000);
}

function stopCountdown(){
  if(timer) clearInterval(timer);
  timer = null;
  noBtn.innerText = "NO";
}

document.getElementById("yes").onclick = () => {
  stopCountdown();
  box.style.display="none";
  state.innerText="THANK GOD !!";
  hero.innerText="You are safe";
  setTimeout(()=>{
    state.innerText="SAFE";
    hero.innerText="Your personal emergency shield";
  },3000);
};

document.getElementById("no").onclick = triggerEmergency;

// ---------------- EMERGENCY ----------------
function triggerEmergency(){
  stopCountdown();
  box.style.display="none";
  state.innerText="EMERGENCY";
  state.style.color="red";
  hero.innerText="Help is being alerted";
  navigator.vibrate([200,100,200,100,200]);
  showContacts();
  contactsBox.style.display="block";
  startPriorityCalling();


}

// ---------------- SHAKE SENSOR ----------------
let motionEnabled=false, shakeCount=0, lastShake=0, lastDetected=0;

document.body.addEventListener("click",()=>{
 if(motionEnabled) return;
 if(DeviceMotionEvent && DeviceMotionEvent.requestPermission){
   DeviceMotionEvent.requestPermission().then(r=>{if(r==="granted") motionEnabled=true;});
 } else motionEnabled=true;
});

window.addEventListener("devicemotion",(e)=>{
 if(!motionEnabled) return;
 const a=e.accelerationIncludingGravity; if(!a) return;
 const strength=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
 if(strength>28){
  const now=Date.now();
  if(now-lastDetected>300){ shakeCount++; lastDetected=now; }
  if(now-lastShake>2000) shakeCount=1;
  lastShake=now;
  if(shakeCount>=3){ shakeCount=0; showConfirm(); }
 }
});

// ---------------- PHONE SNATCH DETECTION ----------------
let lastTouch=Date.now(), violentTime=0;
document.addEventListener("touchstart",()=> lastTouch=Date.now());

window.addEventListener("devicemotion",(e)=>{
 if(!motionEnabled) return;
 const a=e.accelerationIncludingGravity; if(!a) return;
 const strength=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
 if(strength>40){
  violentTime=Date.now();
  setTimeout(()=>{
    if(Date.now()-lastTouch>3000 && Date.now()-violentTime<4000){
      showConfirm();
    }
  },3000);
 }
});
  // ================= PRIORITY CALL ENGINE =================
function startPriorityCalling(){
  let contacts = JSON.parse(localStorage.getItem("guardianContacts")||"[]");

  let p1 = contacts.filter(c=>c.priority==1);
  let p2 = contacts.filter(c=>c.priority==2);
  let p3 = contacts.filter(c=>c.priority==3);
  let p4 = contacts.filter(c=>c.priority==4);

  let queue = [];

  // 1 & 2 → 3 rounds
  for(let i=0;i<3;i++) queue.push(...p1, ...p2);

  // 3 & 4 → 2 rounds
  for(let i=0;i<2;i++) queue.push(...p3, ...p4);

  dial(queue,0);
}

function dial(queue,i){
  if(i>=queue.length) return;
  hero.innerText = "Calling " + queue[i].name;
  window.location.href = "tel:" + queue[i].phone;
  setTimeout(()=> dial(queue,i+1), 15000);
}
function toggleProfile(){
  profileBox.style.display = profileBox.style.display=="none"?"block":"none";
}

function toggleContacts(){
  contactsBox.style.display = contactsBox.style.display=="none"?"block":"none";
  showContacts();
}

function saveProfile(){
  const profile={
    name:pname.value, age:page.value, gender:pgender.value,
    blood:pblood.value, height:pheight.value, weight:pweight.value
  };
  localStorage.setItem("guardianProfile",JSON.stringify(profile));
  alert("Profile saved");
}

function loadProfile(){
  let p=JSON.parse(localStorage.getItem("guardianProfile")||"{}");
  pname.value=p.name||""; page.value=p.age||""; pgender.value=p.gender||"";
  pblood.value=p.blood||""; pheight.value=p.height||""; pweight.value=p.weight||"";
}
loadProfile();

function showContacts(){
  let contacts=JSON.parse(localStorage.getItem("guardianContacts")||"[]");
  list.innerHTML="";
  topContacts.innerHTML="<b>Emergency Contacts</b><br>";
  contacts.sort((a,b)=>a.priority-b.priority);
  contacts.forEach((c,i)=>{
    list.innerHTML+=`<div class="badge p${c.priority}">
      ${c.name} - ${c.phone} 
      <button onclick="removeContact(${i})">❌</button>
    </div>`;
    topContacts.innerHTML+=`<div class="badge p${c.priority}">${c.name}</div>`;
  });
}

function removeContact(i){
  let contacts=JSON.parse(localStorage.getItem("guardianContacts"));
  contacts.splice(i,1);
  localStorage.setItem("guardianContacts",JSON.stringify(contacts));
  showContacts();
}
  

</script>

</body>
</html>
