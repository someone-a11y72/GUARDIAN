<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GUARDIAN</title>

<style>
body{margin:0;background:#000;color:white;font-family:-apple-system,BlinkMacSystemFont,Segoe UI;}
#app{max-width:420px;margin:auto;height:100vh;display:flex;flex-direction:column;}
#top{padding:16px;display:flex;justify-content:space-between;align-items:center;background:#0b0b0b;border-bottom:1px solid #222;}
#logo{color:#ff3b30;font-weight:700;letter-spacing:3px;}
#status{text-align:center;margin-top:30px;}
#state{font-size:48px;font-weight:800;color:#00ff88;}
#hero{color:#999;margin-top:8px;}
#sos{margin:40px auto;width:280px;height:280px;border-radius:50%;border:none;background:#ff3b30;color:white;font-size:26px;font-weight:700;box-shadow:0 0 40px rgba(255,59,48,.6);}
.panel{position:fixed;inset:0;background:#000;display:none;overflow:auto;padding:20px;}
.back{color:#ff3b30;margin-bottom:10px;cursor:pointer;}
input,select{width:100%;padding:14px;border-radius:10px;border:none;background:#111;color:white;margin-bottom:12px;}
.primaryBtn{width:100%;padding:16px;font-size:18px;background:#ff3b30;color:white;border:none;border-radius:14px;}
.saveBtn{width:100%;padding:16px;font-size:18px;background:#00c853;color:black;border:none;border-radius:14px;margin-top:10px;}
.badge{background:#111;padding:14px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;}
#confirmBox{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;}
#confirmBox button{width:240px;padding:18px;margin:10px;border:none;border-radius:14px;font-size:20px;}
#yes{background:#00c853;color:black;}
#no{background:#ff3b30;color:white;}
</style>
</head>

<body>
<div id="app">
  <div id="top">
    <div id="logo">GUARDIAN</div>
    <div>
      <button onclick="toggleProfile()">Medical Info</button>
      <button onclick="toggleContacts()">Contacts</button>
    </div>
  </div>

  <div id="status">
    <div id="state">SAFE</div>
    <div id="hero">Your personal emergency shield</div>
  </div>

  <button id="sos">EMERGENCY SOS</button>
</div>

<!-- Confirm -->
<div id="confirmBox">
  <h2>Are you safe?</h2>
  <button id="yes">YES</button>
  <button id="no">NO</button>
</div>

<!-- Medical -->
<div id="profileBox" class="panel">
  <div class="back" onclick="toggleProfile()">← Back</div>
  <h2>Medical Information</h2>
  <input id="pname" placeholder="Name">
  <input id="page" placeholder="Age">
  <input id="pgender" placeholder="Gender">
  <input id="pblood" placeholder="Blood Type">
  <input id="pheight" placeholder="Height">
  <input id="pweight" placeholder="Weight">
  <button class="saveBtn" onclick="saveProfile()">Save Medical Info</button>
</div>

<!-- Contacts -->
<div id="contactsBox" class="panel">
  <div class="back" onclick="toggleContacts()">← Back</div>
  <h2>Emergency Contacts</h2>
  <input id="cname" placeholder="Name">
  <input id="cphone" placeholder="Phone">
  <select id="cpriority">
    <option value="1">Priority 1</option>
    <option value="2">Priority 2</option>
    <option value="3">Priority 3</option>
    <option value="4">Priority 4</option>
  </select>
  <button id="addContact" class="primaryBtn">Add Contact</button>
  <div id="list"></div>
</div>

<script>
const state=document.getElementById("state"),hero=document.getElementById("hero"),box=document.getElementById("confirmBox");
const pname=pname||document.getElementById("pname"),page=document.getElementById("page"),pgender=document.getElementById("pgender"),pblood=document.getElementById("pblood"),pheight=document.getElementById("pheight"),pweight=document.getElementById("pweight");
const cname=document.getElementById("cname"),cphone=document.getElementById("cphone"),cpriority=document.getElementById("cpriority"),list=document.getElementById("list");

document.getElementById("sos").onclick=()=>showConfirm();
document.getElementById("yes").onclick=()=>{box.style.display="none";state.innerText="SAFE";};
document.getElementById("no").onclick=triggerEmergency;

function showConfirm(){box.style.display="flex";}
function triggerEmergency(){box.style.display="none";state.innerText="EMERGENCY";state.style.color="red";startPriorityCalling();}

function toggleProfile(){profileBox.style.display=profileBox.style.display=="block"?"none":"block";}
function toggleContacts(){contactsBox.style.display=contactsBox.style.display=="block"?"none":"block";showContacts();}

function saveProfile(){
 if(!pname.value||!page.value||!pgender.value||!pblood.value||!pheight.value||!pweight.value){alert("Fill all");return;}
 localStorage.setItem("guardianProfile",JSON.stringify({name:pname.value,age:page.value,gender:pgender.value,blood:pblood.value,height:pheight.value,weight:pweight.value}));
 alert("Saved");
}

let editIndex=null;
document.getElementById("addContact").onclick=()=>{
 let contacts=JSON.parse(localStorage.getItem("guardianContacts")||"[]");
 if(contacts.some(c=>c.phone==cphone.value)&&editIndex==null){alert("Duplicate");return;}
 let data={name:cname.value,phone:cphone.value,priority:cpriority.value};
 if(editIndex!=null){contacts[editIndex]=data;editIndex=null;}
 else contacts.push(data);
 localStorage.setItem("guardianContacts",JSON.stringify(contacts));
 cname.value="";cphone.value="";
 showContacts();
};

function showContacts(){
 let contacts=JSON.parse(localStorage.getItem("guardianContacts")||"[]");
 list.innerHTML="";
 contacts.forEach((c,i)=>list.innerHTML+=`<div class="badge">${c.name} - ${c.phone}<span><button onclick="editContact(${i})">Edit</button><button onclick="removeContact(${i})">❌</button></span></div>`);
}
function editContact(i){
 let c=JSON.parse(localStorage.getItem("guardianContacts"))[i];
 cname.value=c.name;cphone.value=c.phone;cpriority.value=c.priority;editIndex=i;
}
function removeContact(i){
 let c=JSON.parse(localStorage.getItem("guardianContacts"));c.splice(i,1);
 localStorage.setItem("guardianContacts",JSON.stringify(c));showContacts();
}

function startPriorityCalling(){
 let contacts=JSON.parse(localStorage.getItem("guardianContacts")||"[]");
 contacts.forEach(c=>window.location.href="tel:"+c.phone);
}
</script>

</body>
</html>
